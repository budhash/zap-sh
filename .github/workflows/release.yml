name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'  # Trigger on any tag starting with 'v'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run linting
        run: make lint

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            bash-version: "4+"
            description: "Ubuntu (Bash 4+)"
          - os: macos-latest
            bash-version: "3.2+"
            description: "macOS (Bash 3.2+)"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install shellcheck

      - name: Show bash version
        run: |
          echo "Platform: ${{ matrix.description }}"
          bash --version | head -1

      - name: Verify bash compatibility (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          bash_version=$(bash --version | head -1 | grep -o '[0-9]\+\.[0-9]\+')
          echo "Detected bash version: $bash_version"
          if [[ "$bash_version" < "3.2" ]]; then
            echo "ERROR: Bash version too old: $bash_version"
            exit 1
          fi
          echo "✅ Bash $bash_version meets minimum requirement (3.2+)"

      - name: Check dependencies
        run: make check-deps

      - name: Verify version consistency
        run: |
          echo "Pre-release version status:"
          make version

      - name: Run tests
        run: make test

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_NUMBER=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Verify version consistency
        run: |
          TAG_VERSION="${{ steps.version.outputs.version_number }}"
          FILE_VERSION=$(cat version.txt 2>/dev/null || echo "")
          
          if [[ "$FILE_VERSION" != "$TAG_VERSION" ]]; then
            echo "❌ Version mismatch!"
            echo "  Tag version: $TAG_VERSION"
            echo "  File version: $FILE_VERSION"
            echo ""
            echo "Version status:"
            make version
            exit 1
          fi
          
          echo "✅ Version consistency verified: $TAG_VERSION"
          echo ""
          echo "Complete version status:"
          make version

      - name: Create release archive
        run: |
          VERSION_NUMBER="${{ steps.version.outputs.version_number }}"
          make create-archive VERSION="$VERSION_NUMBER"

      - name: Set release assets
        id: assets
        run: |
          VERSION_NUMBER="${{ steps.version.outputs.version_number }}"
          ARCHIVE_NAME="zap-sh-${VERSION_NUMBER}.zip"
          echo "archive=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "Archive: $ARCHIVE_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: zap-sh ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.assets.outputs.archive }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "✅ Release created successfully"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Archive: ${{ steps.assets.outputs.archive }}"
          echo ""
          echo "Final version status:"
          make version

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Ordered last (needs: release) and non-fatal: a tap push failure must never
    # fail the release. The GitHub release + npm publish (release-npm.yml) have
    # already shipped by the time this runs; if HOMEBREW_TAP_TOKEN is missing or
    # the push fails, this job goes red on its own without affecting anything else.
    needs: [release]
    continue-on-error: true
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Compute source-tarball sha256
        id: sha
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          echo "Hashing $URL"
          curl -fsSL "$URL" -o source.tar.gz
          SHA=$(sha256sum source.tar.gz | cut -d' ' -f1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA"

      - name: Generate formula
        run: |
          mkdir -p dist
          # Installs the bare `zap-sh` script from the tag's source tarball;
          # templates auto-download to ~/.config/zap-sh on first `init`.
          cat > dist/zap-sh.rb <<'RUBY'
          class ZapSh < Formula
            desc "Lightning-fast bash script generator"
            homepage "https://github.com/budhash/zap-sh"
            url "${{ steps.sha.outputs.url }}"
            sha256 "${{ steps.sha.outputs.sha256 }}"
            version "${{ steps.version.outputs.number }}"
            license "MIT"

            def install
              bin.install "zap-sh"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/zap-sh -v")
            end
          end
          RUBY
          echo "----- Formula/zap-sh.rb -----"
          cat dist/zap-sh.rb
          ruby -c dist/zap-sh.rb

      - name: Push formula to budhash/homebrew-tools
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set — skipping tap update."
            echo "Add a fine-grained PAT (Contents: Read+write on budhash/homebrew-tools) as the HOMEBREW_TAP_TOKEN secret."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/budhash/homebrew-tools.git" tap
          mkdir -p tap/Formula
          cp dist/zap-sh.rb tap/Formula/zap-sh.rb
          cd tap
          git config user.name "budhash"
          git config user.email "budhash@gmail.com"
          git add Formula/zap-sh.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date — nothing to push."
            exit 0
          fi
          git commit -m "zap-sh ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
          echo "✅ Pushed Formula/zap-sh.rb to budhash/homebrew-tools"