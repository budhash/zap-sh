name: Publish npm

# Publishes @budhash/zap-sh to npm via OIDC trusted publishing (no long-lived
# token). Triggered by the same v* tags as the bash release. Requires an npm
# Trusted Publisher configured for this package:
#   Publisher: GitHub Actions · Org: budhash · Repo: zap-sh
#   Workflow filename: release-npm.yml · Environment: (blank)
# Publishes only when the tag matches packages/generator/package.json; otherwise
# it skips cleanly (e.g. a bash-only tag where the JS package did not change).

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish @budhash/zap-sh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # required for npm OIDC trusted publishing
    defaults:
      run:
        working-directory: packages/generator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/generator/package-lock.json

      - name: Guard — tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG != package version $PKG — skipping npm publish"
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            echo "publishing @budhash/zap-sh@$PKG"
          fi

      - name: Ensure npm supports trusted publishing
        if: env.SKIP != '1'
        run: npm install -g npm@latest

      - name: Install
        if: env.SKIP != '1'
        run: npm ci

      - name: Publish (OIDC trusted publishing, with provenance)
        if: env.SKIP != '1'
        run: npm publish
